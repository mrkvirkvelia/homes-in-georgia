name: CI/CD
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:      # «Run workflow» on GitHub: redeploy main without a new commit

concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: false }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: homes, POSTGRES_PASSWORD: homes, POSTGRES_DB: homes_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U homes" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://homes:homes@localhost:5432/homes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements.txt\nbot/requirements.txt" }
      - run: pip install -r bot/requirements.txt
      - name: backend tests
        run: cd backend && python -m pytest -q
      - name: bot tests
        run: cd bot && python -m unittest discover -s test
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: frontend build
        run: cd frontend && npm ci && npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    steps:
      - name: deploy to prod
        env: { KEY: "${{ secrets.DEPLOY_SSH_KEY }}", HOST: "${{ secrets.DEPLOY_HOST }}" }
        run: |
          install -m 600 /dev/null ~/key && echo "$KEY" > ~/key
          ssh -i ~/key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 root@$HOST \
            deploy   # the key is pinned on the server to `git show origin/main:deploy/deploy.sh | sh` (authorized_keys command=)
